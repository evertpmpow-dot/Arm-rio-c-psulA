name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Baixar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Localizar projeto Android
        run: |
          find . -name "settings.gradle*" -o -name "build.gradle*"

      - name: Gerar APK
        run: |
          PROJECT=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "Projeto encontrado em: $PROJECT_DIR"
          ./gradle-8.7/bin/gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Armario-do-Everton-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
